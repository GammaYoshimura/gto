[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-ko-gto"
version = "0.1.0"
description = "Motor preflop 3-max Space KO (Fase 1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
equity = ["eval7>=0.1.10"]
gpu = ["torch>=2.1"]

[project.scripts]
space-ko-build-equity = "space_ko_gto.equity_builder:main"
space-ko-solve = "space_ko_gto.run_solver:main"
space-ko-batch = "space_ko_gto.run_batch:main"
space-ko-verify-db = "space_ko_gto.verify_db:main"

[tool.setuptools.packages.find]
include = ["space_ko_gto*"]
